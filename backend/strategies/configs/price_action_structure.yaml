v1:
  trade_choch: true
  trade_bos: true
  stop_atr_mult: 1.0
  target_r_multiples:
  - 1.5
  - 3.0
  no_entry_after: '14:45'
  # BOS/CHoCH structure breaks are noise in a choppy range (22% win rate, -671k) - restrict to
  # trending regimes where a "break of structure" actually means something.
  allowed_regimes: [trending_up, trending_down]
