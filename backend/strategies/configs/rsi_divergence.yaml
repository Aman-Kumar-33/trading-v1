v1:
  min_price_diff_atr: 0.2
  min_rsi_diff: 3.0
  stop_atr_buffer: 0.3
  target_r_multiples:
  - 1.0
  - 2.0
  no_entry_after: '14:45'
  # Divergence is a reversal bet - fading a strong trend on divergence alone is exactly how it lost
  # (33% win rate, -228k). Only trade it in a range where a reversal is plausible.
  allowed_regimes: [ranging]
