v1:
  touch_atr_tolerance: 0.3
  stop_atr_buffer: 0.5
  target_r_multiples:
  - 1.0
  - 2.0
  no_entry_after: '14:45'
  # A "trend pullback" strategy has no business firing outside an actual trend - it was doing so
  # (12% win rate, -614k, worst win rate of any strategy). Restrict to trending regimes.
  allowed_regimes: [trending_up, trending_down]
